spring.application.name=lotnisko-backend
server.port=8080

# MariaDB Configuration
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lotnisko}
spring.datasource.username=${DB_USER:lotnisko_user}
spring.datasource.password=${DB_PASSWORD:lotnisko_pass}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
